<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESULT ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#07121f;
    color:#fff;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#00e5ff;
    margin:5px 0 8px;
}

.pageTitle{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#fff;
    margin-bottom:18px;
}

.card{
    background:#0d1d2d;
    border:1px solid #142b40;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 0 10px rgba(0,229,255,.08);
}

.sectionTitle{
    text-align:center;
    color:#00e5ff;
    font-size:16px;
    font-weight:bold;
    margin-bottom:15px;
}

label{
    display:block;
    color:#9fd9e5;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    height:44px;
    border:1px solid #21445d;
    border-radius:8px;
    background:#07121f;
    color:#fff;
    padding:0 12px;
    font-size:16px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#00e5ff;
}

.formGroup{
    margin-bottom:13px;
}

.row{
    display:flex;
    gap:10px;
}

.row .formGroup{
    flex:1;
}

.autoValue{
    width:100%;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07121f;
    border:1px solid #21445d;
    border-radius:8px;
    color:#00e5ff;
    font-size:20px;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    height:44px;
    border:0;
    border-radius:8px;
    background:#00bcd4;
    color:#00151d;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

button.secondary{
    background:#142b40;
    color:#fff;
    border:1px solid #21445d;
}

button:disabled{
    opacity:.5;
}

.editingInfo{
    display:none;
    text-align:center;
    background:#6b3a14;
    color:#ffd9a8;
    border-radius:7px;
    padding:8px;
    margin-bottom:12px;
    font-size:12px;
    font-weight:bold;
}

.status{
    display:none;
    text-align:center;
    padding:9px;
    border-radius:7px;
    margin-top:10px;
    font-size:13px;
    font-weight:bold;
}

.status.success{
    display:block;
    background:#103c2d;
    color:#66ffc8;
}

.status.error{
    display:block;
    background:#4b1820;
    color:#ff9da8;
}

.loginCard{
    display:none;
}

.loginInfo{
    text-align:center;
    color:#9fb8c7;
    font-size:12px;
    line-height:1.5;
    margin-bottom:15px;
}

.savedItem{
    background:#07121f;
    border:1px solid #1b3549;
    border-radius:9px;
    padding:11px;
    margin-bottom:9px;
}

.savedTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.savedDate{
    color:#00e5ff;
    font-size:13px;
    font-weight:bold;
}

.savedTime{
    color:#fff;
    background:#142b40;
    padding:4px 7px;
    border-radius:5px;
    font-size:11px;
}

.savedNumber{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#fff;
    letter-spacing:3px;
    margin:7px 0;
}

.savedDetails{
    display:flex;
    justify-content:center;
    gap:20px;
    color:#9fd9e5;
    font-size:11px;
}

.editBtn{
    width:100%;
    height:35px;
    margin-top:9px;
    background:#142b40;
    color:#00e5ff;
    border:1px solid #21445d;
    font-size:12px;
}

.logoutBtn{
    width:100%;
    height:38px;
    margin-top:10px;
    background:#142b40;
    color:#ff9da8;
    border:1px solid #4b2730;
    font-size:12px;
}

.loading{
    text-align:center;
    color:#8fa8b7;
    font-size:13px;
    padding:12px;
}

.empty{
    text-align:center;
    color:#718899;
    font-size:13px;
    padding:15px 5px;
}

.userInfo{
    text-align:center;
    color:#718899;
    font-size:11px;
    margin-top:8px;
    word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">✦</div>
    <div class="pageTitle">RESULT ADMIN</div>

    <!-- LOGIN -->
    <div class="card loginCard" id="loginCard">

        <div class="sectionTitle">ADMIN LOGIN</div>

        <div class="loginInfo">
            Login with your Supabase admin account.
        </div>

        <div class="formGroup">
            <label>EMAIL</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter email"
                autocomplete="username"
            >
        </div>

        <div class="formGroup">
            <label>PASSWORD</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                autocomplete="current-password"
            >
        </div>

        <button onclick="loginAdmin()" id="loginButton">
            LOGIN
        </button>

        <div class="status" id="loginStatus"></div>
    </div>


    <!-- ADMIN CONTENT -->
    <div id="adminContent" style="display:none;">

        <!-- RESULT ENTRY -->
        <div class="card">

            <div class="sectionTitle">
                RESULT ENTRY
            </div>

            <div
                id="editingInfo"
                class="editingInfo">
                EDITING EXISTING RESULT
            </div>

            <div class="row">

                <div class="formGroup">
                    <label>DATE</label>

                    <input
                        type="date"
                        id="dateInput"
                        onchange="dateChanged()"
                    >
                </div>

                <div class="formGroup">
                    <label>TIME</label>

                    <select
                        id="timeInput"
                        onchange="timeChanged">

                        <option value="11 AM">11 AM</option>
                        <option value="1 PM">1 PM</option>
                        <option value="5 PM">5 PM</option>
                        <option value="7 PM">7 PM</option>

                    </select>
                </div>

            </div>


            <div class="formGroup">

                <label>3 DIGIT</label>

                <input
                    type="text"
                    id="threeDigitInput"
                    maxlength="3"
                    inputmode="numeric"
                    placeholder="Enter 3 digit"
                    oninput="calculateNumbers()"
                >

            </div>


            <div class="row">

                <div class="formGroup">

                    <label>2 DIGIT</label>

                    <div
                        class="autoValue"
                        id="twoDigitValue">
                        —
                    </div>

                </div>


                <div class="formGroup">

                    <label>1 DIGIT</label>

                    <div
                        class="autoValue"
                        id="oneDigitValue">
                        —
                    </div>

                </div>

            </div>


            <div class="buttons">

                <button
                    id="saveButton"
                    onclick="saveEntry()">
                    SAVE
                </button>

                <button
                    class="secondary"
                    onclick="clearForm()">
                    CLEAR
                </button>

            </div>

            <div
                class="status"
                id="saveStatus">
            </div>

        </div>


        <!-- SAVED DATA -->
        <div class="card">

            <div class="sectionTitle">
                SAVED DATA
            </div>

            <div id="savedDataList">
                <div class="loading">
                    Loading...
                </div>
            </div>

        </div>


        <div class="card">

            <button
                class="logoutBtn"
                onclick="logoutAdmin()">
                LOGOUT
            </button>

            <div
                class="userInfo"
                id="userInfo">
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
========================================================= */

const SUPABASE_URL =
    "https://nlrfzuqpaiifvkvxwvho.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_0iZhQxmZWXY9uiBi5jjuxw_TaXZ_iAq";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   VARIABLES
========================================================= */

let editingId = null;


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        setToday();

        const {
            data: {
                session
            }
        } = await db.auth.getSession();


        if(session){

            showAdmin(session);

        }else{

            showLogin();

        }

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    function(event, session){

        if(session){

            showAdmin(session);

        }else{

            showLogin();

        }

    }
);


/* =========================================================
   SHOW LOGIN
========================================================= */

function showLogin(){

    document.getElementById(
        "loginCard"
    ).style.display = "block";

    document.getElementById(
        "adminContent"
    ).style.display = "none";

}


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdmin(session){

    document.getElementById(
        "loginCard"
    ).style.display = "none";

    document.getElementById(
        "adminContent"
    ).style.display = "block";


    if(session && session.user){

        document.getElementById(
            "userInfo"
        ).textContent =
            session.user.email || "";

    }


    loadSavedData();

}


/* =========================================================
   LOGIN
========================================================= */

async function loginAdmin(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        showLoginStatus(
            "Please enter email and password.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "LOGIN...";


    const {
        data,
        error
    } = await db.auth.signInWithPassword({

        email:email,
        password:password

    });


    button.disabled = false;

    button.textContent =
        "LOGIN";


    if(error){

        showLoginStatus(
            error.message,
            "error"
        );

        return;
    }


    showLoginStatus(
        "Login successful.",
        "success"
    );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logoutAdmin(){

    await db.auth.signOut();

    editingId = null;

    clearForm();

}


/* =========================================================
   SET TODAY
========================================================= */

function setToday(){

    const input =
        document.getElementById(
            "dateInput"
        );

    const now =
        new Date();


    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");


    input.value =
        `${year}-${month}-${day}`;

}


/* =========================================================
   CALCULATE NUMBERS
========================================================= */

function calculateNumbers(){

    let value =
        document.getElementById(
            "threeDigitInput"
        ).value;


    value =
        value
        .replace(/\D/g,"")
        .slice(0,3);


    document.getElementById(
        "threeDigitInput"
    ).value =
        value;


    if(value.length === 3){

        document.getElementById(
            "twoDigitValue"
        ).textContent =
            value.slice(1,3);


        document.getElementById(
            "oneDigitValue"
        ).textContent =
            value.slice(2,3);

    }else{

        document.getElementById(
            "twoDigitValue"
        ).textContent =
            "—";


        document.getElementById(
            "oneDigitValue"
        ).textContent =
            "—";

    }

}


/* =========================================================
   DATE / TIME CHANGE
========================================================= */

function dateChanged(){

    if(editingId !== null){

        checkExistingEntry();

    }

}


function timeChanged(){

    if(editingId !== null){

        checkExistingEntry();

    }

}


/* =========================================================
   CHECK EXISTING ENTRY
========================================================= */

async function checkExistingEntry(){

    const date =
        document.getElementById(
            "dateInput"
        ).value;

    const time =
        document.getElementById(
            "timeInput"
        ).value;


    if(!date || !time){

        return;

    }


    const {
        data,
        error
    } = await db
        .from("Result")
        .select("*")
        .eq("result_date",date)
        .eq("result_time",time)
        .maybeSingle();


    if(error){

        console.log(error);

        return;

    }


    if(data){

        editingId =
            data.id;


        document.getElementById(
            "threeDigitInput"
        ).value =
            data.three_digit || "";


        calculateNumbers();


        document.getElementById(
            "editingInfo"
        ).style.display =
            "block";


        document.getElementById(
            "saveButton"
        ).textContent =
            "UPDATE";

    }

}


/* =========================================================
   SAVE / UPDATE
========================================================= */

async function saveEntry(){

    const date =
        document.getElementById(
            "dateInput"
        ).value;


    const time =
        document.getElementById(
            "timeInput"
        ).value;


    const threeDigit =
        document.getElementById(
            "threeDigitInput"
        ).value
        .replace(/\D/g,"")
        .slice(0,3);


    if(!date){

        showSaveStatus(
            "Please select date.",
            "error"
        );

        return;

    }


    if(threeDigit.length !== 3){

        showSaveStatus(
            "Please enter exactly 3 digits.",
            "error"
        );

        return;

    }


    const twoDigit =
        threeDigit.slice(1,3);

    const oneDigit =
        threeDigit.slice(2,3);


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled = true;


    saveButton.textContent =
        editingId !== null
        ? "UPDATING..."
        : "SAVING...";


    let result;


    /* =====================================================
       UPDATE EXISTING
    ===================================================== */

    if(editingId !== null){

        result =
            await db
                .from("Result")
                .update({

                    result_date:date,
                    result_time:time,
                    three_digit:threeDigit,
                    two_digit:twoDigit,
                    one_digit:oneDigit

                })
                .eq("id",editingId);


    }else{


        /* =================================================
           CHECK DATE + TIME
        ================================================= */

        const {
            data:existing,
            error:checkError
        } = await db
            .from("Result")
            .select("id")
            .eq("result_date",date)
            .eq("result_time",time)
            .maybeSingle();


        if(checkError){

            console.log(checkError);

            result = {
                error:checkError
            };

        }else if(existing){

            editingId =
                existing.id;


            result =
                await db
                    .from("Result")
                    .update({

                        result_date:date,
                        result_time:time,
                        three_digit:threeDigit,
                        two_digit:twoDigit,
                        one_digit:oneDigit

                    })
                    .eq("id",editingId);

        }else{


            /* =================================================
               INSERT NEW
            ================================================= */

            result =
                await db
                    .from("Result")
                    .insert({

                        result_date:date,
                        result_time:time,
                        three_digit:threeDigit,
                        two_digit:twoDigit,
                        one_digit:oneDigit

                    });

        }

    }


    saveButton.disabled = false;


    saveButton.textContent =
        editingId !== null
        ? "UPDATE"
        : "SAVE";


    if(result.error){

        console.log(result.error);

        showSaveStatus(
            result.error.message,
            "error"
        );

        return;

    }


    showSaveStatus(
        editingId !== null
        ? "RESULT UPDATED ✓"
        : "RESULT SAVED ✓",
        "success"
    );


    clearForm();

    await loadSavedData();

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm(){

    editingId = null;

    setToday();


    document.getElementById(
        "timeInput"
    ).value =
        "11 AM";


    document.getElementById(
        "threeDigitInput"
    ).value =
        "";


    document.getElementById(
        "twoDigitValue"
    ).textContent =
        "—";


    document.getElementById(
        "oneDigitValue"
    ).textContent =
        "—";


    document.getElementById(
        "editingInfo"
    ).style.display =
        "none";


    document.getElementById(
        "saveButton"
    ).textContent =
        "SAVE";

}


/* =========================================================
   LOAD SAVED DATA
========================================================= */

async function loadSavedData(){

    const box =
        document.getElementById(
            "savedDataList"
        );


    box.innerHTML =
        '<div class="loading">Loading...</div>';


    const {
        data,
        error
    } = await db
        .from("Result")
        .select("*")
        .order("result_date",{
            ascending:false
        })
        .order("result_time",{
            ascending:true
        });


    if(error){

        console.log(
            "Load error:",
            error
        );


        box.innerHTML =
            '<div class="empty">Unable to load data.</div>';


        return;

    }


    if(!data || data.length === 0){

        box.innerHTML =
            '<div class="empty">No saved results yet.</div>';


        return;

    }


    box.innerHTML =
        "";


    data.forEach(function(item){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "savedItem";


        const top =
            document.createElement(
                "div"
            );


        top.className =
            "savedTop";


        const date =
            document.createElement(
                "div"
            );


        date.className =
            "savedDate";


        date.textContent =
            formatDisplayDate(
                item.result_date
            );


        const time =
            document.createElement(
                "div"
            );


        time.className =
            "savedTime";


        time.textContent =
            item.result_time || "—";


        top.appendChild(date);

        top.appendChild(time);


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "savedNumber";


        number.textContent =
            item.three_digit || "—";


        const details =
            document.createElement(
                "div"
            );


        details.className =
            "savedDetails";


        details.innerHTML =
            "<span>2 DIGIT: <b>" +
            escapeHtml(
                item.two_digit || "—"
            ) +
            "</b></span>" +

            "<span>1 DIGIT: <b>" +
            escapeHtml(
                item.one_digit || "—"
            ) +
            "</b></span>";


        const edit =
            document.createElement(
                "button"
            );


        edit.className =
            "editBtn";


        edit.textContent =
            "EDIT";


        edit.onclick =
            function(){

                editEntry(item);

            };


        div.appendChild(top);

        div.appendChild(number);

        div.appendChild(details);

        div.appendChild(edit);


        box.appendChild(div);

    });

}


/* =========================================================
   EDIT ENTRY
========================================================= */

function editEntry(item){

    editingId =
        item.id;


    document.getElementById(
        "dateInput"
    ).value =
        item.result_date;


    document.getElementById(
        "timeInput"
    ).value =
        item.result_time;


    document.getElementById(
        "threeDigitInput"
    ).value =
        item.three_digit || "";


    calculateNumbers();


    document.getElementById(
        "editingInfo"
    ).style.display =
        "block";


    document.getElementById(
        "saveButton"
    ).textContent =
        "UPDATE";


    window.scrollTo({

        top:0,
        behavior:"smooth"

    });

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDisplayDate(dateString){

    if(!dateString){

        return "";

    }


    const parts =
        String(dateString)
        .split("-");


    if(parts.length !== 3){

        return dateString;

    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   STATUS
========================================================= */

function showLoginStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "loginStatus"
        );


    box.textContent =
        message;


    box.className =
        "status " + type;

}


function showSaveStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "saveStatus"
        );


    box.textContent =
        message;


    box.className =
        "status " + type;


    setTimeout(function(){

        box.className =
            "status";

    },4000);

}

</script>

</body>
</html>
