<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIN LOT</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#102235;
    color:#fff;
}

.container{
    width:100%;
    max-width:480px;
    margin:auto;
}

/* WIN LOT LOGO */
.logoArea{
    text-align:center;
    padding-top:22px;
    padding-bottom:16px;
}

.logoIcon{
    width:42px;
    height:42px;
    margin:0 auto 6px;
    border:2px solid #ffffff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-size:24px;
    font-weight:bold;
    line-height:1;
    box-shadow:0 0 12px rgba(82,226,239,.45);
}

.logoText{
    color:#ffffff;
    font-size:30px;
    font-weight:900;
    letter-spacing:4px;
    line-height:1;
    text-shadow:0 0 10px rgba(82,226,239,.45);
}

.nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:15px;
}

.nav button{
    border:1px solid #28566f;
    background:#173149;
    color:#fff;
    border-radius:9px;
    padding:11px 4px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.nav button.active{
    background:#35cfe3;
    color:#07121f;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.todayBox{
    background:#173149;
    border:1px solid #28566f;
    border-radius:12px;
    padding:14px;
    text-align:center;
    margin-bottom:15px;
}

.todayDate{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    font-size:20px;
    font-weight:bold;
    color:#52e2ef;
    white-space:nowrap;
}

.resultCard{
    background:#173149;
    border:1px solid #36738a;
    border-radius:14px;
    padding:20px 14px 22px;
    box-shadow:0 5px 18px rgba(0,0,0,.18);
    margin-bottom:18px;
}

.resultHeader{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    margin-bottom:20px;
    flex-wrap:nowrap;
}

.resultTime,
.resultDate{
    margin:0;
    font-size:22px;
    font-weight:bold;
    color:#52e2ef;
    line-height:1;
    white-space:nowrap;
}

.resultTable{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
    border:1px solid #36738a;
    border-radius:10px;
}

.resultTable td{
    height:82px;
    border-bottom:1px solid #28566f;
    text-align:center;
    vertical-align:middle;
}

.resultTable tr:last-child td{
    border-bottom:none;
}

.resultLabel{
    width:50%;
    font-size:14px;
    font-weight:bold;
    color:#fff;
}

.resultValue{
    width:50%;
    font-size:28px;
    font-weight:bold;
    color:#52e2ef;
}

.timeButtons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    width:100%;
    margin-bottom:12px;
}

.timeButtons button{
    width:100%;
    border:1px solid #28566f;
    background:#173149;
    color:#ffffff;
    border-radius:9px;
    padding:14px 4px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.timeButtons button.active{
    background:#35cfe3;
    color:#07121f;
}

.downloadResultBtn{
    width:100%;
    border:1px solid #35cfe3;
    background:#35cfe3;
    color:#07121f;
    border-radius:9px;
    padding:14px 8px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.rangeButtons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:12px;
}

.rangeButtons button{
    border:1px solid #28566f;
    background:#173149;
    color:#fff;
    border-radius:8px;
    padding:10px 2px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.rangeButtons button.active{
    background:#35cfe3;
    color:#07121f;
}

.historyBox{
    background:#173149;
    border:1px solid #36738a;
    border-radius:12px;
    padding:6px;
    overflow:hidden;
}

.historyTable{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.historyTable th{
    font-size:10px;
    color:#52e2ef;
    padding:9px 2px;
    border-bottom:1px solid #28566f;
}

.historyTable td{
    text-align:center;
    font-size:11px;
    padding:10px 2px;
    border-bottom:1px solid #28566f;
}

.historyTable tr:last-child td{
    border-bottom:none;
}

.resultCell{
    color:#52e2ef;
    font-weight:bold;
}

.empty{
    color:#708797;
}

.contactBox{
    background:#173149;
    border:1px solid #36738a;
    border-radius:12px;
    padding:20px;
    text-align:center;
}

.contactBox h3{
    color:#52e2ef;
    margin-top:0;
}

.contactBox p{
    font-size:14px;
    line-height:1.6;
}

@media(max-width:360px){

    .container{
        padding:0;
    }

    .logoArea{
        padding-top:18px;
        padding-bottom:14px;
    }

    .logoIcon{
        width:38px;
        height:38px;
        font-size:21px;
    }

    .logoText{
        font-size:27px;
        letter-spacing:3px;
    }

    .todayDate{
        gap:14px;
        font-size:18px;
    }

    .resultHeader{
        gap:18px;
    }

    .resultTime,
    .resultDate{
        font-size:19px;
    }

    .resultTable td{
        height:76px;
    }

    .resultLabel{
        font-size:12px;
    }

    .resultValue{
        font-size:24px;
    }

    .timeButtons{
        gap:8px;
    }

    .timeButtons button{
        padding:13px 4px;
        font-size:12px;
    }

    .historyBox{
        padding:4px;
    }

    .historyTable th{
        font-size:9px;
        padding:8px 0;
    }

    .historyTable td{
        font-size:10px;
        padding:9px 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logoArea">
        <div class="logoIcon">✦</div>
        <div class="logoText">WIN LOT</div>
    </div>

    <div class="nav">

        <button class="active"
                onclick="showPage('home',this)">
            HOME
        </button>

        <button onclick="showPage('result',this)">
            RESULT
        </button>

        <button onclick="showPage('contact',this)">
            CONTACT
        </button>

    </div>


    <!-- HOME -->
    <div id="home" class="page active">

        <div class="todayBox">

            <div class="todayDate">

                <span id="homeDateText"></span>

                <span id="homeDayText"></span>

            </div>

        </div>


        <div class="resultCard" id="downloadArea">

            <div class="resultHeader">

                <div class="resultTime" id="selectedTime">
                    11 AM
                </div>

                <div class="resultDate" id="selectedDate">
                    —
                </div>

            </div>


            <table class="resultTable">

                <tr>

                    <td class="resultLabel">
                        3 DIGIT
                    </td>

                    <td class="resultValue" id="threeDigit">
                        —
                    </td>

                </tr>

                <tr>

                    <td class="resultLabel">
                        2 DIGIT
                    </td>

                    <td class="resultValue" id="twoDigit">
                        —
                    </td>

                </tr>

                <tr>

                    <td class="resultLabel">
                        1 DIGIT
                    </td>

                    <td class="resultValue" id="oneDigit">
                        —
                    </td>

                </tr>

            </table>

        </div>


        <div class="timeButtons">

            <button id="time11"
                    onclick="selectTime('11 AM')">
                11 AM
            </button>

            <button id="time1"
                    onclick="selectTime('1 PM')">
                1 PM
            </button>

            <button id="time5"
                    onclick="selectTime('5 PM')">
                5 PM
            </button>

            <button id="time7"
                    onclick="selectTime('7 PM')">
                7 PM
            </button>

        </div>


        <button class="downloadResultBtn"
                onclick="downloadResult()">
            DOWNLOAD RESULT
        </button>

    </div>


    <!-- RESULT -->
    <div id="result" class="page">

        <div class="rangeButtons">

            <button class="active"
                    onclick="setRange(5,this)">
                5 DAYS
            </button>

            <button onclick="setRange(10,this)">
                10 DAYS
            </button>

            <button onclick="setRange(15,this)">
                15 DAYS
            </button>

            <button onclick="setRange(30,this)">
                1 MONTH
            </button>

        </div>


        <div class="historyBox">

            <table class="historyTable">

                <thead>

                    <tr>
                        <th>DATE</th>
                        <th>11 AM</th>
                        <th>1 PM</th>
                        <th>5 PM</th>
                        <th>7 PM</th>
                    </tr>

                </thead>

                <tbody id="historyBody"></tbody>

            </table>

        </div>

    </div>


    <!-- CONTACT -->
    <div id="contact" class="page">

        <div class="contactBox">

            <h3>CONTACT</h3>

            <p>
                For any enquiries, please contact us.
            </p>

        </div>

    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://nlrfzuqpaiifvkvxwvho.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0iZhQxmZWXY9uiBi5jjuxw_TaXZ_iAq";


/* =========================================
   DATA
========================================= */

let RESULT_DATA = {};

let selectedTime = "11 AM";

let currentRange = 5;


/* =========================================
   DATE
========================================= */

function formatDate(date){

    const day =
        String(date.getDate()).padStart(2,"0");

    const month =
        String(date.getMonth()+1).padStart(2,"0");

    const year =
        date.getFullYear();

    return day+"/"+month+"/"+year;
}


function formatDay(date){

    return date.toLocaleDateString(
        "en-US",
        {
            weekday:"long"
        }
    );
}


function parseDate(dateString){

    const parts =
        dateString.split("/");

    return new Date(
        Number(parts[2]),
        Number(parts[1])-1,
        Number(parts[0])
    );
}


/* =========================================
   TODAY
========================================= */

const today = new Date();

const todayString =
    formatDate(today);

document.getElementById("homeDateText").textContent =
    todayString;

document.getElementById("homeDayText").textContent =
    formatDay(today);

document.getElementById("selectedDate").textContent =
    todayString;


/* =========================================
   NORMALIZE TIME
========================================= */

function normalizeTime(value){

    if(value === null || value === undefined){
        return "";
    }

    let t =
        String(value)
        .trim()
        .toUpperCase()
        .replace(/\s+/g," ");

    t = t.replace(/\./g,"");


    if(
        t === "11 AM" ||
        t === "11AM" ||
        t === "11:00 AM" ||
        t === "11:00AM" ||
        t === "11:00"
    ){
        return "11 AM";
    }


    if(
        t === "1 PM" ||
        t === "1PM" ||
        t === "01 PM" ||
        t === "01PM" ||
        t === "1:00 PM" ||
        t === "1:00PM" ||
        t === "13:00"
    ){
        return "1 PM";
    }


    if(
        t === "5 PM" ||
        t === "5PM" ||
        t === "05 PM" ||
        t === "05PM" ||
        t === "5:00 PM" ||
        t === "5:00PM" ||
        t === "17:00"
    ){
        return "5 PM";
    }


    if(
        t === "7 PM" ||
        t === "7PM" ||
        t === "07 PM" ||
        t === "07PM" ||
        t === "7:00 PM" ||
        t === "7:00PM" ||
        t === "19:00"
    ){
        return "7 PM";
    }

    return t;
}


/* =========================================
   NORMALIZE DATE
========================================= */

function normalizeDate(value){

    if(!value){
        return "";
    }

    const text =
        String(value).trim();


    if(/^\d{4}-\d{2}-\d{2}$/.test(text)){

        const p =
            text.split("-");

        return (
            p[2] +
            "/" +
            p[1] +
            "/" +
            p[0]
        );
    }


    if(text.includes("T")){

        const datePart =
            text.split("T")[0];

        if(/^\d{4}-\d{2}-\d{2}$/.test(datePart)){

            const p =
                datePart.split("-");

            return (
                p[2] +
                "/" +
                p[1] +
                "/" +
                p[0]
            );
        }
    }


    if(/^\d{2}\/\d{2}\/\d{4}$/.test(text)){

        return text;
    }

    return "";
}


/* =========================================
   FETCH SUPABASE DATA
========================================= */

async function loadResultData(){

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/Result" +
            "?select=id,result_date,result_time,three_digit,two_digit,one_digit,created_at" +
            "&order=result_date.desc,created_at.desc";


        console.log(
            "Loading WIN LOT data from Supabase..."
        );


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + SUPABASE_KEY,

                        "Accept":
                            "application/json",

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "Supabase Error:",
                response.status,
                errorText
            );

            return;
        }


        const rows =
            await response.json();


        console.log(
            "Supabase rows received:",
            rows.length
        );


        RESULT_DATA = {};


        rows.forEach(function(row){

            const displayDate =
                normalizeDate(row.result_date);

            const normalizedTime =
                normalizeTime(row.result_time);


            if(!displayDate || !normalizedTime){

                console.warn(
                    "Skipped row:",
                    row
                );

                return;
            }


            if(!RESULT_DATA[displayDate]){

                RESULT_DATA[displayDate] = {};

            }


            if(!RESULT_DATA[displayDate][normalizedTime]){

                RESULT_DATA[displayDate][normalizedTime] = {

                    three_digit:
                        row.three_digit === null
                            ? ""
                            : String(row.three_digit),

                    two_digit:
                        row.two_digit === null
                            ? ""
                            : String(row.two_digit),

                    one_digit:
                        row.one_digit === null
                            ? ""
                            : String(row.one_digit)

                };

            }

        });


        console.log(
            "WIN LOT RESULT_DATA:",
            RESULT_DATA
        );


        selectTime(selectedTime);

        drawHistory();


    }catch(error){

        console.error(
            "Supabase connection error:",
            error
        );

    }

}


/* =========================================
   SELECT TIME
========================================= */

function selectTime(time){

    selectedTime = time;


    document
        .querySelectorAll(".timeButtons button")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    if(time === "11 AM"){

        document
            .getElementById("time11")
            .classList.add("active");

    }


    if(time === "1 PM"){

        document
            .getElementById("time1")
            .classList.add("active");

    }


    if(time === "5 PM"){

        document
            .getElementById("time5")
            .classList.add("active");

    }


    if(time === "7 PM"){

        document
            .getElementById("time7")
            .classList.add("active");

    }


    document.getElementById("selectedTime").textContent =
        time;

    document.getElementById("selectedDate").textContent =
        todayString;


    const dateData =
        RESULT_DATA[todayString] || {};


    const data =
        dateData[time] || {};


    const three =
        data.three_digit || "—";


    document.getElementById("threeDigit").textContent =
        three;


    if(three !== "—" && three !== ""){

        document.getElementById("twoDigit").textContent =
            data.two_digit || three.slice(-2);

        document.getElementById("oneDigit").textContent =
            data.one_digit || three.slice(-1);

    }else{

        document.getElementById("twoDigit").textContent =
            "—";

        document.getElementById("oneDigit").textContent =
            "—";

    }

}


/* =========================================
   DOWNLOAD RESULT
========================================= */

function downloadResult(){

    const resultArea =
        document.getElementById("downloadArea");


    if(typeof html2canvas === "undefined"){

        alert(
            "Download system is loading. Please try again."
        );

        return;
    }


    html2canvas(
        resultArea,
        {
            backgroundColor:"#173149",
            scale:2,
            useCORS:true,
            logging:false
        }
    ).then(function(canvas){

        const link =
            document.createElement("a");


        const safeDate =
            todayString.replace(/\//g,"-");


        const safeTime =
            selectedTime
                .replace(/\s+/g,"-")
                .toLowerCase();


        link.download =
            "WIN-LOT-"+safeDate+"-"+safeTime+".png";


        link.href =
            canvas.toDataURL("image/png");


        link.click();

    }).catch(function(){

        alert(
            "Unable to create image. Please try again."
        );

    });

}


/* =========================================
   PAGE NAVIGATION
========================================= */

function showPage(pageId,button){

    document
        .querySelectorAll(".page")
        .forEach(function(page){

            page.classList.remove("active");

        });


    const selectedPage =
        document.getElementById(pageId);


    if(selectedPage){

        selectedPage.classList.add("active");

    }


    document
        .querySelectorAll(".nav button")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    if(button){

        button.classList.add("active");

    }


    if(pageId === "result"){

        drawHistory();

    }

}


/* =========================================
   HISTORY
========================================= */

function drawHistory(){

    const body =
        document.getElementById("historyBody");


    if(!body){

        return;
    }


    body.innerHTML = "";


    const dates =
        Object.keys(RESULT_DATA)
            .sort(function(a,b){

                return parseDate(b)-parseDate(a);

            })
            .slice(0,currentRange);


    dates.forEach(function(date){

        const data =
            RESULT_DATA[date] || {};


        const tr =
            document.createElement("tr");


        const dateCell =
            document.createElement("td");


        dateCell.textContent =
            date;


        tr.appendChild(dateCell);


        [
            "11 AM",
            "1 PM",
            "5 PM",
            "7 PM"
        ]
        .forEach(function(time){

            const td =
                document.createElement("td");


            const timeData =
                data[time] || {};


            const value =
                timeData.three_digit || "";


            if(value){

                td.textContent =
                    value;

                td.className =
                    "resultCell";

            }else{

                td.textContent =
                    "—";

                td.className =
                    "empty";

            }


            tr.appendChild(td);

        });


        body.appendChild(tr);

    });


    if(dates.length === 0){

        const tr =
            document.createElement("tr");


        const td =
            document.createElement("td");


        td.colSpan = 5;

        td.textContent =
            "No result data available";

        td.className =
            "empty";


        tr.appendChild(td);

        body.appendChild(tr);

    }

}


/* =========================================
   RANGE
========================================= */

function setRange(range,button){

    currentRange = range;


    document
        .querySelectorAll(".rangeButtons button")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    if(button){

        button.classList.add("active");

    }


    drawHistory();

}


/* =========================================
   INITIAL LOAD
========================================= */

selectTime("11 AM");

drawHistory();

loadResultData();

</script>

</body>
</html>
